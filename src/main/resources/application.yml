spring:
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
server:
  port: 8080
  servlet:
    context-path: /superMarketServices
# swagger-ui custom path
springdoc:
  swagger-ui:
    path: /swagger-ui.html

supermarket:
  security:
    # Obligatorios y sin valor por defecto a propósito
    jwt-secret: ${JWT_SECRET}
    username: ${SUPERMARKET_USER}
    password: ${SUPERMARKET_PASSWORD}
